project:
  type: website
  output-dir: docs 

website:
  title: "Applied Probability"
  sidebar:
    style: "floating"
    contents:
      - section: "Course Info"
        contents:
          - index.qmd
          - conventions.qmd
      - section: "Foundations"
        contents:
          - lectures/state_space.qmd
          - lectures/permutations_combinations.qmd
          - lectures/inclusion_exclusion.qmd
          - lectures/axioms.qmd
          - lectures/conditional_probability.qmd
          - lectures/bayes_theorem.qmd

      - section: "Random Variables"
        contents:
          - lectures/random_variables.qmd
          - lectures/discrete_rv.qmd
          - lectures/continuous_rv.qmd
          - lectures/expectation.qmd
          - lectures/variance.qmd
          - lectures/joint_distributions.qmd
          - lectures/mgfs.qmd
          - lectures/sample_statistics.qmd
          - lectures/bounds.qmd
      - section: "Inference"

format:
  html:
    theme: cosmo
    css: custom.css
    toc: true
    html-math-method: katex
    code-copy: true

editor: visual